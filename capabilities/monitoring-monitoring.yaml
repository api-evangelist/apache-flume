naftiko: 1.0.0-alpha2
info:
  label: Apache Flume Monitoring API — Monitoring
  description: 'Apache Flume Monitoring API — Monitoring. 1 operations. Lead operation: Apache Flume Get Agent Metrics. Self-contained
    Naftiko capability covering one Apache Flume business surface.'
  tags:
  - Apache Flume
  - Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_FLUME_API_KEY: APACHE_FLUME_API_KEY
capability:
  consumes:
  - type: http
    namespace: monitoring-monitoring
    baseUri: http://localhost:41414
    description: Apache Flume Monitoring API — Monitoring business capability. Self-contained, no shared references.
    resources:
    - name: metrics
      path: /metrics
      operations:
      - name: getmetrics
        method: GET
        description: Apache Flume Get Agent Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: monitoring-monitoring-rest
    port: 8080
    description: REST adapter for Apache Flume Monitoring API — Monitoring. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/metrics
      name: metrics
      description: REST surface for metrics.
      operations:
      - method: GET
        name: getmetrics
        description: Apache Flume Get Agent Metrics
        call: monitoring-monitoring.getmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: monitoring-monitoring-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Flume Monitoring API — Monitoring. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: apache-flume-get-agent-metrics
      description: Apache Flume Get Agent Metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: monitoring-monitoring.getmetrics
      outputParameters:
      - type: object
        mapping: $.
